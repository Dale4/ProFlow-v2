name: Build and Push to ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  IMAGE_NAME: proflow-api

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ProFlow.slnx

      - name: Build
        run: dotnet build ProFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ProFlow.slnx --configuration Release --no-build --verbosity normal

  push-to-ecr:
     - name: Debug - Show OIDC claims and secrets
       run: |
         echo "=== Checking if secret AWS_ROLE_ARN exists ==="
         if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
           echo "❌ AWS_ROLE_ARN secret is EMPTY or does not exist"
         else
           echo "✅ AWS_ROLE_ARN secret exists (length: ${#AWS_ROLE_ARN})"
           echo "First 30 characters: ${AWS_ROLE_ARN:0:30}..."
         fi

         echo ""
         echo "=== Requesting OIDC token ==="
         RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
           "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
    
         echo "$RESPONSE" | jq .

         TOKEN=$(echo "$RESPONSE" | jq -r .value)
    
         if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
           echo "❌ Failed to get OIDC token. Check that 'permissions: id-token: write' is present."
         else
           echo ""
           echo "=== Decoded OIDC Claims (this is the important part) ==="
           echo "$TOKEN" | cut -d '.' -f 2 | base64 -d 2>/dev/null | jq .
         fi
        env:
           AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
