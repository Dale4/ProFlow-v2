name: Build and Push to ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  IMAGE_NAME: proflow-api

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ProFlow.slnx

      - name: Build
        run: dotnet build ProFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ProFlow.slnx --configuration Release --no-build --verbosity normal

  push-to-ecr:
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug OIDC token
         uses: actions/github-script@v7
         with:
           script: |
             const token = await core.getIDToken()
             const parts = token.split('.')
             const payload = JSON.parse(Buffer.from(parts[1], 'base64').toString())
             console.log('=== OIDC Token Claims ===')
             console.log(JSON.stringify(payload, null, 2))
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${REPOSITORY}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${SHORT_SHA},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "Test"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          {
            echo "### Pushed image"
            echo ""
            echo "- \`${IMAGE}:${SHORT_SHA}\`"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
